<!DOCTYPE html>
<html>
<head>
    <title>Sorular</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">📝 Soru ve Konular</h2>

    <div class="card shadow p-4">

        <form method="POST">

            <label>Soru Sayısı</label>
            <input type="number" name="soru_sayisi" class="form-control mb-3" required>

            <div id="sorular_alani"></div>

            <button class="btn btn-primary mt-3">Kaydet</button>

        </form>

    </div>

    <div class="text-center mt-3">
        <a href="/" class="btn btn-secondary">Geri</a>
    </div>

</div>

<script>
const input = document.querySelector("input[name='soru_sayisi']");
const alan = document.getElementById("sorular_alani");

input.addEventListener("input", () => {
    alan.innerHTML = "";

    for (let i = 1; i <= input.value; i++) {
        alan.innerHTML += `
        <div class="mb-3">
            <label class="fw-bold">📘 Soru ${i} Konusu</label>
            <input 
                type="text" 
                name="s${i}" 
                class="form-control" 
                placeholder="Örn: Basınçlar"
                required
            >
        </div>
        `;
    }
});
</script>

</body>
</html>
