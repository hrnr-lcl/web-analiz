<!DOCTYPE html>
<html>
<head>
    <title>Analiz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">📊 Analiz</h1>

    <div class="card p-4 shadow mb-4">
        <table class="table text-center">

            <tr>
                <th>Konu</th>
                <th>Başarı</th>
                <th>Öneri</th>
            </tr>

            {% for a in analiz %}
            <tr class="
                {% if a.oran < 50 %} table-danger
                {% elif a.oran < 75 %} table-warning
                {% else %} table-success
                {% endif %}
            ">
                <td>{{ a.konu }}</td>
                <td>{{ a.oran }}%</td>
                <td>{{ a.telafi }}</td>
            </tr>
            {% endfor %}

        </table>
    </div>

    <div class="card p-4 shadow mb-4">
        <canvas id="chart"></canvas>
    </div>

    <div class="text-center">
        <form action="/">
            <button class="btn btn-primary btn-lg">Ana Sayfa</button>
        </form>
    </div>

</div>

<script>
const labels = {{ analiz | map(attribute='konu') | list | tojson }};
const data = {{ analiz | map(attribute='oran') | list | tojson }};

new Chart(document.getElementById("chart"), {
    type: "bar",
    data: {
        labels: labels,
        datasets: [{
            label: "Başarı (%)",
            data: data
        }]
    }
});
</script>

</body>
</html>
